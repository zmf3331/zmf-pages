# ---------------- #
#   Main Configs   #
# ---------------- #
# 项目站点（GitHub Pages）：线上地址 = url + baseurl
# 线上：https://zmf3331.github.io/zmf-pages/
baseurl: "/zmf-pages"
url: "https://zmf3331.github.io"
date_format: "ordinal"
title: 朱名斐的博客
subtitle: "记录学习、思考与技术实践"
description: "记录学习、思考与技术实践"
keywords: 朱名斐, 博客, 学习, 思考, 技术实践
timezone: Asia/Shanghai
encoding: "utf-8"
# 页面左下角显示的年份
since: 2026
# 源码仓库（jekyll-github-metadata 用，供页面右上方展示仓库信息）
repository: zmf3331/zmf-pages
# 对 css 和 js 资源的 cdn 加速配置
cdn:
    jsdelivr:
        enabled: false
# 可选组件配置
components:
    # 分享
    # weibo,qq,wechat,douban,qzone,linkedin,facebook,twitter
    share:
        enabled: false
        hide-platforms: weibo,douban,qzone,linkedin,facebook,twitter
    # 不蒜子访问统计
    busuanzi:
        enabled: false
        start_date: 2026-10-10
    # 侧边栏仓库信息
    side_bar_repo:
        enabled: false
        limit: 5
    # 文章字数统计
    word_count:
        enabled: true
    # 「关于」页面的二维码（图片位于 assets/images/qrcode.jpg）
    qrcode:
        enabled: false
        image_alt: 朱名斐
    # 分类索引页使用的视图，支持 列表（list）/分类（cate）
    wiki:
        view: cate
    # 图片灯箱效果功能
    fancybox:
        enabled: false
# 压缩页面内容
compress_html:
  clippings: all
  comments: ["<!--", "-->"]
# 代码高亮风格，支持的 theme 列表见 https://github.com/mzlogin/rouge-themes
highlight_theme: github

# ---------------- #
#      Author      #
# ---------------- #
author: 朱名斐
organization:
organization_url:
github_username: zmf3331
github_username_url: https://github.com/zmf3331
location: China
email: zmf3331@163.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页
  -
    href: /archives/
    label: 归档
  -
    href: /categories/
    label: 分类
  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
# 说明：GitHub Pages 只允许白名单内的插件，请不要在这里添加自定义插件
plugins:
    - jekyll-github-metadata
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jekyll-seo-tag
    - jemoji

# ---------------- #
#      Comments    #
# ---------------- #
# support provider: disqus, gitment, gitalk, utterances, beaudar, giscus
comments_provider: giscus
# !!!重要!!! 使用评论前请把下面替换为你自己在 giscus.app 生成的信息
# 参考：https://giscus.app/zh-CN
disqus:
    username:
gitment:
    owner:
    repo:
    oauth:
        client_id:
        client_secret:
gitalk:
    owner:
    repo:
    clientID:
    clientSecret:
# utterances 配置参考：https://utteranc.es/
utterances:
    repo:
# beaudar 配置参考：https://beaudar.lipk.org/
beaudar:
    repo:
# giscus 配置参考：https://giscus.app/zh-CN
giscus:
    repo:
    repo-id:
    category:
    category-id:
    light: light
# 在使用其它评论组件时可点击显示 Disqus
lazy_load_disqus: false

# ---------------- #
#      Google      #
# ---------------- #
google:
    analytics_id:
    adsense:
        enabled: false
        footer: false
        sidebar: false
        sidebar-detail: false
        content_header: false
        content_footer: false

# 允许未来日期的 post 也参与构建（避免时区/时间错配被跳过）
future: true

